<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ANDOS · Drive Connect</title>
<style>
  body{margin:0;background:#0b0d10;color:#e8eaed;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{max-width:560px;width:92%;background:#14171c;border:1px solid #262b33;border-radius:14px;padding:28px;box-sizing:border-box;text-align:center}
  h1{font-size:17px;margin:0 0 6px;letter-spacing:.04em}
  p{font-size:13.5px;line-height:1.6;color:#9aa3af;margin:10px 0}
  .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:#0b0d10;border:1px solid #2e3540;border-radius:8px;padding:14px;margin:14px 0;word-break:break-all;color:#7dd3a0;user-select:all}
  .err{color:#f07178}
  button{background:#2f6feb;color:#fff;border:0;border-radius:8px;padding:11px 20px;font-size:14px;cursor:pointer}
  button:hover{background:#3d7cf5}
  .muted{font-size:11.5px;color:#5d6673;margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <h1>◆ ANDOS · DRIVE CONNECT</h1>
  <p id="msg">Processing…</p>
  <div class="code" id="code" hidden></div>
  <button id="btn" hidden onclick="copyCode()">Copy code</button>
  <div class="muted">Temporary page · will be removed after connection</div>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var err = q.get("error"), code = q.get("code"), st = q.get("state");
  var msg = document.getElementById("msg"), codeEl = document.getElementById("code"), btn = document.getElementById("btn");
  if (err) {
    msg.innerHTML = '<span class="err">Consent failed: ' + (q.get("error_description") || err) + '</span>';
  } else if (code) {
    msg.textContent = "Connection approved ✓ — paste this single-use code to the agent (valid 10 minutes):";
    codeEl.textContent = code + (st ? "   [state: " + st + "]" : "");
    codeEl.hidden = false; btn.hidden = false;
  } else {
    msg.innerHTML = '<span class="err">No code received. Open the link given by the agent.</span>';
  }
  function copyCode(){
    navigator.clipboard.writeText(code).then(function(){ btn.textContent = "Copied ✓"; },
      function(){ btn.textContent = "Select & copy manually"; });
  }
  window.copyCode = copyCode;
})();
</script>
</body>
</html>
