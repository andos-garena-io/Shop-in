*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;background:#000}
body{
  min-height:100svh;background:#000;color:#fff;
  font-family:'NunitoEmbed',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;overflow:hidden;
}

.screen{
  touch-action:manipulation;
  --w:min(100vw,520px);
  --u:calc(var(--w) / 843);
  width:var(--w);height:100svh;
  position:relative;background:#000;overflow:hidden;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  animation:screenIn .9s cubic-bezier(.22,1,.36,1) both;
}
@keyframes screenIn{from{opacity:0}to{opacity:1}}

/* ---------- space particles (canvas) ---------- */
#space{
  touch-action:none;
  position:absolute;inset:0;width:100%;height:100%;
  z-index:0;pointer-events:none;
  opacity:0;animation:fadeIn 2.4s .6s ease forwards;
}

/* hold-to-charge indicator */
.screen.charging::after{
  content:"";position:absolute;z-index:1;pointer-events:none;
  left:var(--hx,50%);top:var(--hy,50%);
  width:calc(20 * var(--u));height:calc(20 * var(--u));
  margin:calc(-10 * var(--u));border-radius:50%;
  border:calc(2 * var(--u)) solid rgba(255,200,150,.85);
  box-shadow:0 0 calc(18 * var(--u)) rgba(255,170,90,.5);
  opacity:0;
  animation:charge 4s linear forwards;
}
@keyframes charge{
  0%  {opacity:0;  transform:scale(.2)}
  12% {opacity:.35;transform:scale(1)}
  85% {opacity:.75;transform:scale(5.2)}
  100%{opacity:0;  transform:scale(7)}
}


/* ---------- auth: loading state ----------
   The button does NOT gain a new widget. It simply keeps doing what it
   already does — the Google G it already shows starts breathing, the
   sheen that already sweeps the pill speeds up, and the label
   cross-fades to "Signing in". Nothing foreign is added.            */
.gbtn.busy{pointer-events:none}

/* the existing G icon becomes the progress indicator */
.gbtn.busy svg{
  animation:gWork 1.5s cubic-bezier(.45,0,.55,1) infinite;
  transition:none;
}
@keyframes gWork{
  0%  {transform:rotate(0)      scale(1)}
  45% {transform:rotate(180deg) scale(.86)}
  55% {transform:rotate(180deg) scale(.86)}
  100%{transform:rotate(360deg) scale(1)}
}

/* the sheen that already lives in the pill just gets busier */
.gbtn.busy ~ .sheen::before,
.gbtn.busy .sheen::before{
  animation:sheenRun 1.25s linear infinite;
}

/* label cross-fade — same font, same place, no layout shift */
.gbtn .lbl{position:relative}
.gbtn .lbl .txt-idle,
.gbtn .lbl .txt-busy{
  transition:opacity .28s ease,transform .28s cubic-bezier(.22,1,.36,1);
}
.gbtn .lbl .txt-busy{
  position:absolute;left:0;right:0;top:0;
  opacity:0;transform:translateY(calc(6 * var(--u)));
  white-space:nowrap;
}
.gbtn.busy .lbl .txt-idle{opacity:0;transform:translateY(calc(-6 * var(--u)))}
.gbtn.busy .lbl .txt-busy{opacity:1;transform:translateY(0)}

/* the three dots after "Signing in" */
.dot{opacity:.25;animation:dotPulse 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}
@keyframes dotPulse{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* a hairline of light travels along the pill's own edge */
.gbtn.busy::before{
  background:linear-gradient(105deg,transparent 30%,rgba(0,0,0,.10) 46%,transparent 60%);
  animation:shine 1.1s linear infinite;
}

/* ---------- toast ---------- */
.toast{
  cursor:pointer;
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);
  transform:translate(-50%,140%);
  max-width:min(80vw,360px);
  padding:11px 16px;border-radius:12px;
  background:rgba(28,28,30,.96);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 12px 40px rgba(0,0,0,.6);
  color:#fff;font-size:13px;line-height:1.4;text-align:center;
  z-index:99;opacity:0;pointer-events:none;
  transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .35s ease;
}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.err{border-color:rgba(234,67,53,.5)}
.toast.ok{border-color:rgba(52,168,83,.5)}

/* ---------- signed-in overlay ---------- */
.welcome{
  position:absolute;inset:0;z-index:40;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(26 * var(--u));
  background:rgba(0,0,0,.82);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  opacity:0;pointer-events:none;transition:opacity .5s ease;
  padding:0 calc(60 * var(--u));text-align:center;
}
.welcome.show{opacity:1;pointer-events:auto}
.welcome img{
  width:calc(150 * var(--u));height:calc(150 * var(--u));
  border-radius:50%;border:calc(3 * var(--u)) solid rgba(255,255,255,.25);
  object-fit:cover;
  animation:avatarIn .7s cubic-bezier(.16,1,.3,1) both;
}
@keyframes avatarIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.welcome h2{font-size:calc(46 * var(--u));font-weight:800;letter-spacing:-.02em}
.welcome p{font-size:calc(28 * var(--u));opacity:.7;word-break:break-all}
.welcome button{
  margin-top:calc(14 * var(--u));
  padding:calc(20 * var(--u)) calc(52 * var(--u));
  border:1px solid rgba(255,255,255,.3);border-radius:999px;
  background:transparent;color:#fff;
  font-family:inherit;font-size:calc(28 * var(--u));font-weight:700;
  cursor:pointer;transition:background .25s ease,transform .15s ease;
}
.welcome button:hover{background:rgba(255,255,255,.1)}
.welcome button:active{transform:scale(.96)}

/* everything sits above the starfield */
.title,.rule,.logo,.bottom{z-index:5}

@keyframes logoIn{
  0%  {opacity:0;transform:translateY(calc(-50% + 26 * var(--u))) scale(.9)}

  100%{opacity:1;transform:translateY(-50%) scale(1)}

/* ---------- BOTTOM STACK ---------- */
.bottom{
  position:absolute;left:calc(67 * var(--u));right:calc(67 * var(--u));
  bottom:calc(env(safe-area-inset-bottom) + 2.6%);
}

.or{
  display:flex;align-items:center;gap:calc(24 * var(--u));
  height:calc(40 * var(--u));margin-bottom:calc(58 * var(--u));
}
.or::before,.or::after{
  content:"";flex:1;height:1px;background:rgba(255,255,255,.55);
  transform:scaleX(0);
  animation:lineGrow .85s 1.15s cubic-bezier(.22,1,.36,1) forwards;
}
.or::before{transform-origin:right}
.or::after {transform-origin:left}
.or span{
  font-size:calc(30 * var(--u));line-height:1;font-weight:400;color:#fff;
  opacity:0;animation:fadeIn .6s 1.2s forwards;
}

/* ---------- GOOGLE BUTTON ---------- */
.btn-box{position:relative;width:100%;height:calc(104 * var(--u))}

/* one soft white halo pulse — subtle, nothing colourful */
.btn-halo{
  position:absolute;inset:0;border-radius:calc(52 * var(--u));
  pointer-events:none;opacity:0;
  animation:halo 4s 2.4s ease-out infinite;
}
@keyframes halo{
  0%  {opacity:.45;box-shadow:0 0 0 0 rgba(255,255,255,.20)}
  70% {opacity:0;  box-shadow:0 0 0 calc(20 * var(--u)) rgba(255,255,255,0)}
  100%{opacity:0;  box-shadow:0 0 0 0 rgba(255,255,255,0)}
}

.gbtn{
  position:absolute;inset:0;
  border:0;border-radius:calc(52 * var(--u));
  background:#fff;color:#0d0d0d;
  font-family:inherit;font-size:calc(34 * var(--u));font-weight:700;
  letter-spacing:calc(-.3 * var(--u));
  display:flex;align-items:center;justify-content:center;gap:calc(28 * var(--u));
  cursor:pointer;overflow:hidden;
  box-shadow:0 calc(8 * var(--u)) calc(30 * var(--u)) rgba(255,255,255,.12);
  opacity:0;
  animation:btnIn .9s 1.35s cubic-bezier(.22,1,.36,1) forwards;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease;
}
@keyframes btnIn{
  from{opacity:0;transform:translateY(calc(30 * var(--u))) scale(.96)}
  to  {opacity:1;transform:translateY(0) scale(1)}
}
@media (hover:hover) and (pointer:fine){
  .gbtn:hover{box-shadow:0 calc(12 * var(--u)) calc(40 * var(--u)) rgba(255,255,255,.26)}
  .gbtn:hover svg{transform:rotate(-10deg) scale(1.06)}
}
/* never let :active transform compete with the press keyframes */
.gbtn:active:not(.tapped){transform:scale(.965)}
.gbtn.shown{opacity:1;animation:none}
.gbtn:focus-visible{outline:calc(3 * var(--u)) solid rgba(255,255,255,.6);outline-offset:calc(4 * var(--u))}

.gbtn svg{
  width:calc(47 * var(--u));height:calc(48 * var(--u));
  flex:none;display:block;position:relative;z-index:4;
  transition:transform .45s cubic-bezier(.34,1.4,.5,1);
}
.gbtn .lbl{position:relative;z-index:4;color:#0d0d0d}

/* light sweep across the pill */
.gbtn::before{
  content:"";position:absolute;inset:0;z-index:2;
  background:linear-gradient(105deg,transparent 33%,rgba(0,0,0,.07) 48%,transparent 63%);
  transform:translateX(-130%);
  animation:shine 4.5s 2.6s ease-in-out infinite;
}
@keyframes shine{0%{transform:translateX(-130%)}45%,100%{transform:translateX(130%)}}

/* ripple on press */
.gbtn::after{
  content:"";position:absolute;z-index:2;
  left:var(--rx,50%);top:var(--ry,50%);
  width:calc(760 * var(--u));height:calc(760 * var(--u));
  margin:calc(-380 * var(--u));border-radius:50%;
  background:radial-gradient(circle,rgba(0,0,0,.14),rgba(0,0,0,0) 65%);
  transform:scale(0);opacity:0;
}
.gbtn.tapped::after{animation:ripple .68s cubic-bezier(.22,1,.36,1)}
@keyframes ripple{0%{transform:scale(0);opacity:1}100%{transform:scale(1);opacity:0}}

/* ---- idle: slow gradient sheen living inside the pill ---- */
.gbtn{background:#fff}
.sheen{
  position:absolute;inset:0;border-radius:calc(52 * var(--u));
  overflow:hidden;pointer-events:none;z-index:1;
}
.sheen::before{
  content:"";position:absolute;top:-50%;bottom:-50%;width:45%;
  background:linear-gradient(100deg,
    rgba(66,133,244,0) 0%,
    rgba(66,133,244,.13) 30%,
    rgba(234,67,53,.10) 50%,
    rgba(52,168,83,.12) 70%,
    rgba(66,133,244,0) 100%);
  filter:blur(calc(8 * var(--u)));
  transform:translateX(-160%) skewX(-14deg);
  animation:sheenRun 7s 3s ease-in-out infinite;
}
@keyframes sheenRun{
  0%,62%{transform:translateX(-160%) skewX(-14deg)}
  100%  {transform:translateX(320%)  skewX(-14deg)}
}

/* the pill lifts and settles very slowly, like it's floating */
.btn-box{animation:btnFloat 7s 2.6s ease-in-out infinite}
@keyframes btnFloat{
  0%,100%{transform:translateY(0)}
  50%    {transform:translateY(calc(-3 * var(--u)))}
}


/* ---- Google-style particle burst layer (inside the pill) ---- */
.spark{
  position:absolute;inset:0;z-index:3;
  border-radius:calc(52 * var(--u));
  overflow:hidden;pointer-events:none;
}
.spark canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* soft colour wash that blooms from the touch point */
.gbtn .bloom{
  position:absolute;z-index:2;pointer-events:none;
  left:var(--rx,50%);top:var(--ry,50%);
  width:calc(560 * var(--u));height:calc(560 * var(--u));
  margin:calc(-280 * var(--u));border-radius:50%;
  background:conic-gradient(from 0deg,
    rgba(66,133,244,.30),
    rgba(234,67,53,.28),
    rgba(251,188,5,.30),
    rgba(52,168,83,.28),
    rgba(66,133,244,.30));
  filter:blur(calc(26 * var(--u)));
  opacity:0;transform:scale(.2);
}
.gbtn.tapped .bloom{animation:bloomOut .8s cubic-bezier(.22,1,.36,1)}
@keyframes bloomOut{
  0%  {opacity:.9;transform:scale(.2)  rotate(0)}
  100%{opacity:0; transform:scale(1.6) rotate(90deg)}
}

/* ---- touch feedback ---- */
/* icon: one-shot playful spin, always returns to rest */
.gbtn.tapped svg{opacity:1;transition:none;animation:gpop .72s cubic-bezier(.34,1.45,.5,1)}
@keyframes gpop{
  0%  {transform:rotate(0)      scale(1)}
  25% {transform:rotate(-18deg) scale(1.18)}
  55% {transform:rotate(10deg)  scale(.96)}
  80% {transform:rotate(-4deg)  scale(1.05)}
  100%{transform:rotate(0)      scale(1)}
}
/* label nudges with the press */
.gbtn .lbl{transition:transform .45s cubic-bezier(.34,1.4,.5,1),letter-spacing .45s ease}
.gbtn:not(.busy).tapped .lbl{animation:lblNudge .6s cubic-bezier(.34,1.4,.5,1)}
@keyframes lblNudge{
  0%{transform:translateX(0);letter-spacing:calc(-.3 * var(--u))}
  40%{transform:translateX(calc(3 * var(--u)));letter-spacing:calc(.5 * var(--u))}
  100%{transform:translateX(0);letter-spacing:calc(-.3 * var(--u))}
}
/* the whole pill squashes then springs back */
.gbtn.shown.tapped,
.gbtn.tapped{opacity:1;animation:press .5s cubic-bezier(.34,1.5,.5,1)}
@keyframes press{
  0%  {transform:scale(1)}
  30% {transform:scale(.955)}
  60% {transform:scale(1.015)}
  100%{transform:scale(1)}
}
/* expanding ring that flies off the pill on tap */
.tap-ring{
  position:absolute;inset:0;border-radius:calc(52 * var(--u));
  border:calc(2 * var(--u)) solid rgba(255,255,255,.75);
  pointer-events:none;opacity:0;
}
.btn-box.tapped .tap-ring{animation:tapRing .65s cubic-bezier(.22,1,.36,1)}
@keyframes tapRing{
  0%  {opacity:.85;transform:scale(1)}
  100%{opacity:0;  transform:scale(1.14)}
}

/* ---------- LEGAL ---------- */
.legal{
  margin-top:calc(66 * var(--u));
  text-align:center;
  font-size:calc(29 * var(--u));line-height:calc(43 * var(--u));
  font-weight:400;color:#f2f2f2;opacity:.62;
}
.legal .ln{display:block;opacity:0;transform:translateY(calc(12 * var(--u)))}
.legal .ln:nth-child(1){animation:lineUp .8s 1.62s cubic-bezier(.22,1,.36,1) forwards}
.legal .ln:nth-child(2){animation:lineUp .8s 1.74s cubic-bezier(.22,1,.36,1) forwards}
@keyframes lineUp{to{opacity:1;transform:translateY(0)}}
.legal a{
  color:#fff;font-weight:700;text-decoration:none;position:relative;
}
.legal a::after{
  content:"";position:absolute;left:0;right:0;bottom:calc(-3 * var(--u));
  height:1px;background:rgba(255,255,255,.85);
  transform:scaleX(0);transform-origin:right;
  transition:transform .3s cubic-bezier(.22,1,.36,1);
}
.legal a:hover::after,.legal a:focus-visible::after{transform:scaleX(1);transform-origin:left}

@keyframes fadeIn{to{opacity:1}}

@media (max-height:640px){
  .title{top:21%}
  .rule{top:27%}
  .brand{top:calc(21% - 88 * var(--u))}
}
@media (prefers-reduced-motion:reduce){
  /* stop motion, but never break layout or reveal effect layers */
  *,*::before,*::after{animation:none !important;transition:none !important}
  #space{display:none}
  .title .w,.rule,.or span,.legal .ln,.gbtn{opacity:1;transform:none}
  .title{opacity:.78}
  .brand{opacity:1;transform:none}
  .logo{opacity:1;transform:translateY(-50%) scale(1)}
  .rule,.or::before,.or::after{transform:scaleX(1)}
  .btn-halo,.tap-ring,.gbtn::before,.gbtn::after,.sheen::before,.bloom{opacity:0}
  .gbtn.busy svg{animation:none}
  .spark{display:none}
  .legal{opacity:.62}
}
</style>
</head>
<body>
  <main class="screen">
    <canvas id="space"></canvas>

    <div class="brand" role="img" aria-label="ANDOS"></div>

    <h1 class="title"><span class="w">Your</span><span class="w">Digital</span><span class="w">Space</span></h1>
    <div class="rule"></div>

    <div class="logo" role="img" aria-label="Yuva"></div>

    <div class="bottom">
      <div class="or"><span>or</span></div>

      <div class="btn-box">
        <button class="gbtn" type="button">
          <svg viewBox="0 0 47 48" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path fill="#EA4335" d="M23.5 9.32c3.47 0 6.57 1.2 9.02 3.53l6.71-6.71C35.16 2.33 29.84 0 23.5 0 14.31 0 6.38 5.27 2.5 12.95l7.82 6.07C12.17 13.45 17.37 9.32 23.5 9.32z"/>
            <path fill="#4285F4" d="M46.01 24.55c0-1.57-.14-3.09-.4-4.55H23.5v9.02h12.67c-.55 2.9-2.21 5.37-4.7 7.03l7.58 5.88c4.42-4.09 6.96-10.14 6.96-17.38z"/>
            <path fill="#FBBC05" d="M10.32 28.98c-.47-1.42-.74-2.93-.74-4.5s.27-3.08.74-4.5L2.5 13.91C.9 17.09 0 20.68 0 24.48s.9 7.39 2.5 10.57l7.82-6.07z"/>
            <path fill="#34A853" d="M23.5 48c6.34 0 11.68-2.09 15.55-5.69l-7.58-5.88c-2.11 1.42-4.82 2.25-7.97 2.25-6.13 0-11.33-4.13-13.18-9.7L2.5 35.05C6.38 42.73 14.31 48 23.5 48z"/>
          </svg>
          <span class="lbl"><span class="txt-idle">Continue with Google</span><span class="txt-busy">Signing in<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span></span>
          <span class="sheen"></span>
          <span class="bloom"></span>
          <span class="spark"><canvas></canvas></span>
        </button>
        <div class="tap-ring"></div>
        <div class="btn-halo"></div>
      </div>

      <p class="legal">
        <span class="ln">By continuing, you agree to our <a href="#">Terms,</a> <a href="#">Privacy Policy</a></span>
        <span class="ln">and <a href="#">Cookie Use.</a></span>
      </p>
    </div>
    <div class="welcome" id="welcome">
      <img id="wAvatar" alt="" referrerpolicy="no-referrer">
      <h2 id="wName">Welcome</h2>
      <p id="wMail"></p>
      <button type="button" id="signOutBtn">Sign out</button>
    </div>
  </main>

  <div class="toast" id="toast"></div>

<script>
(function(){
  /* --- calm space particles --- */
  var c=document.getElementById('space');
  if(c && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    var x=c.getContext('2d'),W,H,dpr,P=[],NEB=[],METEOR=[],ROCK=[],DEB=[],t=0,shoot=null,nextShoot=4+Math.random()*6,raf=null;
    function build(){
      var n=Math.max(40,Math.min(Math.round(W*H/9000),110));
      NEB=[
        {x:W*0.22,y:H*0.26,r:W*0.55,c1:'rgba(70,100,190,0.055)',s:0.06,p:0.4,d:W*0.05},
        {x:W*0.82,y:H*0.62,r:W*0.60,c1:'rgba(150,90,190,0.045)',s:0.045,p:2.1,d:W*0.06},
        {x:W*0.50,y:H*0.90,r:W*0.50,c1:'rgba(60,150,140,0.035)',s:0.05,p:4.0,d:W*0.04}
      ];
      P=[];
      for(var i=0;i<n;i++){
        var depth=Math.random();               /* 0 = far, 1 = near */
        P.push({
          x:Math.random()*W, y:Math.random()*H,
          r:0.3+depth*1.5,
          a:0.10+depth*0.55,
          sp:0.25+Math.random()*0.7,
          ph:Math.random()*6.28,
          vy:-(0.006+depth*0.05),
          vx:(Math.random()-0.5)*0.012*depth,
          halo:depth>0.82
        });
      }
    }
    function size(){
      dpr=Math.min(window.devicePixelRatio||1,2);
      W=c.clientWidth;H=c.clientHeight;
      c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
      build();
    }
    var last=performance.now();
    function draw(now){
      var dt=(now-last)/1000;last=now;
      if(dt>0.1)dt=0.016;                 /* tab was hidden -> skip the jump */
      t+=dt;
      x.clearRect(0,0,W,H);

      /* soft deep-space nebula, extremely faint */
      for(var k=0;k<NEB.length;k++){
        var nb=NEB[k];
        var nx=nb.x+Math.sin(t*nb.s+nb.p)*nb.d;
        var ny=nb.y+Math.cos(t*nb.s*0.8+nb.p)*nb.d*0.6;
        var ng=x.createRadialGradient(nx,ny,0,nx,ny,nb.r);
        ng.addColorStop(0,nb.c1);
        ng.addColorStop(1,'rgba(0,0,0,0)');
        x.fillStyle=ng;x.beginPath();x.arc(nx,ny,nb.r,0,6.2832);x.fill();
      }

      for(var i=0;i<P.length;i++){
        var p=P[i];
        p.y+=p.vy;p.x+=p.vx;
        if(p.y<-4){p.y=H+4;p.x=Math.random()*W;}
        if(p.x<-4)p.x=W+4; if(p.x>W+4)p.x=-4;
        var tw=p.a*(0.45+0.55*Math.sin(t*p.sp*2.0+p.ph));
        if(tw<0)tw=0;
        if(p.halo&&tw>0.35){
          var g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*6);
          g.addColorStop(0,'rgba(255,255,255,'+(tw*0.20).toFixed(3)+')');
          g.addColorStop(1,'rgba(255,255,255,0)');
          x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r*6,0,6.2832);x.fill();
        }
        x.beginPath();x.arc(p.x,p.y,p.r,0,6.2832);
        x.fillStyle='rgba(255,255,255,'+tw.toFixed(3)+')';x.fill();
      }

      /* rare shooting star */
      nextShoot-=dt;
      if(!shoot&&nextShoot<=0){
        shoot={x:Math.random()*W*0.7,y:Math.random()*H*0.35,vx:W*0.55,vy:H*0.22,life:0};
        nextShoot=9+Math.random()*11;
      }
      if(shoot){
        shoot.life+=dt;
        var k=shoot.life/0.85;
        if(k>=1){shoot=null;}
        else{
          var sx=shoot.x+shoot.vx*shoot.life, sy=shoot.y+shoot.vy*shoot.life;
          var tx=sx-shoot.vx*0.08, ty=sy-shoot.vy*0.08;
          var al=Math.sin(Math.PI*k)*0.5;
          var lg=x.createLinearGradient(tx,ty,sx,sy);
          lg.addColorStop(0,'rgba(255,255,255,0)');
          lg.addColorStop(1,'rgba(255,255,255,'+al.toFixed(3)+')');
          x.strokeStyle=lg;x.lineWidth=1.2;x.lineCap='round';
          x.beginPath();x.moveTo(tx,ty);x.lineTo(sx,sy);x.stroke();
        }
      }
      /* ---- swipe meteors ---- */
      for(var mi=METEOR.length-1;mi>=0;mi--){
        var m=METEOR[mi];
        m.life+=dt;
        if(m.life<0) continue;                 /* still delayed */
        if(m.life>=m.max){METEOR.splice(mi,1);continue;}
        var kk=m.life/m.max;
        var mx=m.x+m.vx*m.life, my=m.y+m.vy*m.life;
        var tx2=mx-m.vx*m.tail, ty2=my-m.vy*m.tail;
        var fade=Math.sin(Math.PI*kk);
        var lg2=x.createLinearGradient(tx2,ty2,mx,my);
        lg2.addColorStop(0,'rgba(255,255,255,0)');
        lg2.addColorStop(0.65,'rgba(200,225,255,'+(fade*0.35).toFixed(3)+')');
        lg2.addColorStop(1,'rgba(255,255,255,'+(fade*0.95).toFixed(3)+')');
        x.strokeStyle=lg2;x.lineWidth=m.w;x.lineCap='round';
        x.beginPath();x.moveTo(tx2,ty2);x.lineTo(mx,my);x.stroke();
        /* bright head */
        var hg=x.createRadialGradient(mx,my,0,mx,my,m.w*4);
        hg.addColorStop(0,'rgba(255,255,255,'+(fade*0.9).toFixed(3)+')');
        hg.addColorStop(1,'rgba(255,255,255,0)');
        x.fillStyle=hg;x.beginPath();x.arc(mx,my,m.w*4,0,6.2832);x.fill();
      }

      /* ---- asteroids ---- */
      for(var ri=ROCK.length-1;ri>=0;ri--){
        var rk=ROCK[ri];
        rk.life+=dt;
        if(rk.life>=rk.max){ROCK.splice(ri,1);continue;}
        var kr=rk.life/rk.max;
        var ax=rk.x+rk.vx*rk.life, ay=rk.y+rk.vy*rk.life;
        rk.rot+=rk.spin*dt;
        var af=Math.min(1, Math.min(kr/0.12, (1-kr)/0.18, 1));

        /* fiery trail */
        var ttx=ax-rk.vx*0.10, tty=ay-rk.vy*0.10;
        var tg=x.createLinearGradient(ttx,tty,ax,ay);
        tg.addColorStop(0,'rgba(255,120,40,0)');
        tg.addColorStop(0.55,'rgba(255,150,60,'+(af*0.28).toFixed(3)+')');
        tg.addColorStop(1,'rgba(255,225,190,'+(af*0.75).toFixed(3)+')');
        x.strokeStyle=tg;x.lineWidth=rk.r*1.5;x.lineCap='round';
        x.beginPath();x.moveTo(ttx,tty);x.lineTo(ax,ay);x.stroke();

        /* hot glow */
        var gg=x.createRadialGradient(ax,ay,0,ax,ay,rk.r*4.2);
        gg.addColorStop(0,'rgba(255,210,150,'+(af*0.55).toFixed(3)+')');
        gg.addColorStop(0.5,'rgba(255,130,50,'+(af*0.18).toFixed(3)+')');
        gg.addColorStop(1,'rgba(255,90,20,0)');
        x.fillStyle=gg;x.beginPath();x.arc(ax,ay,rk.r*4.2,0,6.2832);x.fill();

        /* rocky body */
        x.save();x.translate(ax,ay);x.rotate(rk.rot);
        x.beginPath();
        for(var v=0;v<rk.pts.length;v++){
          var a2=6.2832*v/rk.pts.length, rr=rk.r*rk.pts[v];
          if(v===0)x.moveTo(Math.cos(a2)*rr,Math.sin(a2)*rr);
          else x.lineTo(Math.cos(a2)*rr,Math.sin(a2)*rr);
        }
        x.closePath();
        var bg2=x.createLinearGradient(-rk.r,-rk.r,rk.r,rk.r);
        bg2.addColorStop(0,'rgba(255,235,215,'+af.toFixed(3)+')');
        bg2.addColorStop(1,'rgba(150,105,80,'+(af*0.9).toFixed(3)+')');
        x.fillStyle=bg2;x.fill();
        x.restore();

        /* shed sparks */
        rk.emit-=dt;
        if(rk.emit<=0){
          rk.emit=0.03;
          if(DEB.length>MAX_DEB) DEB.splice(0,DEB.length-MAX_DEB);
          for(var d=0;d<2;d++){
            DEB.push({
              x:ax,y:ay,
              vx:-rk.vx*0.06+(Math.random()-0.5)*40,
              vy:-rk.vy*0.06+(Math.random()-0.5)*40,
              r:0.7+Math.random()*1.6,
              life:0,max:0.32+Math.random()*0.35
            });
          }
        }
      }

      /* ---- debris sparks ---- */
      for(var di=DEB.length-1;di>=0;di--){
        var db=DEB[di];
        db.life+=dt;
        if(db.life>=db.max){DEB.splice(di,1);continue;}
        db.x+=db.vx*dt;db.y+=db.vy*dt;db.vx*=0.94;db.vy*=0.94;
        var kd=1-db.life/db.max;
        x.fillStyle='rgba(255,'+(170+Math.round(60*kd))+','+(90+Math.round(90*kd))+','+(kd*0.85).toFixed(3)+')';
        x.beginPath();x.arc(db.x,db.y,db.r*kd+0.3,0,6.2832);x.fill();
      }

      raf=requestAnimationFrame(draw);
    }
    size();raf=requestAnimationFrame(draw);
    var to;window.addEventListener('resize',function(){clearTimeout(to);to=setTimeout(size,180);});

    /* ---- swipe-driven meteor shower ----
       drag anywhere: 5 shooting stars fly along the swipe direction,
       a fresh volley every 2s while the finger is down, and one final
       volley in the same direction when the finger lifts.            */
    var MAX_METEOR=40, MAX_ROCK=4, MAX_DEB=240;
    window.__yuvaMeteors=function(dirX,dirY){
      if(METEOR.length>MAX_METEOR) METEOR.splice(0,METEOR.length-MAX_METEOR);
      var len=Math.hypot(dirX,dirY)||1;
      var ux=dirX/len, uy=dirY/len;
      var span=Math.hypot(W,H);
      for(var i=0;i<5;i++){
        /* stagger them across the axis perpendicular to the swipe */
        var px=-uy, py=ux;
        var off=(i-2)*(span*0.16)+(Math.random()-0.5)*span*0.07;
        /* start off-screen, behind the direction of travel */
        var cxp=W*0.5+px*off-ux*span*0.62;
        var cyp=H*0.5+py*off-uy*span*0.62;
        METEOR.push({
          x:cxp, y:cyp,
          vx:ux*span*(0.85+Math.random()*0.5),
          vy:uy*span*(0.85+Math.random()*0.5),
          life:-(i*0.09+Math.random()*0.05),   /* negative = delay */
          max:0.95+Math.random()*0.35,
          w:0.9+Math.random()*1.1,
          tail:0.07+Math.random()*0.04
        });
      }
      if(!raf) raf=requestAnimationFrame(draw);
    };

    /* ---- asteroid + escort meteors, launched from a held point ---- */
    window.__yuvaAsteroid=function(px,py){
      if(ROCK.length>=MAX_ROCK) ROCK.shift();
      if(METEOR.length>MAX_METEOR) METEOR.splice(0,METEOR.length-MAX_METEOR);
      var span=Math.hypot(W,H);
      /* travel roughly downward, angled away from screen centre */
      var ang=Math.PI*0.5+(px/W-0.5)*0.8+(Math.random()-0.5)*0.25;
      var ux=Math.cos(ang), uy=Math.sin(ang);

      /* irregular rock silhouette */
      var pts=[],nv=9;
      for(var v=0;v<nv;v++){
        pts.push(0.68+Math.random()*0.42);
      }
      var speed=span*0.62;                 /* px per second            */
      var lead =span*0.55;                 /* start this far off-screen */
      ROCK.push({
        x:px-ux*lead, y:py-uy*lead,
        vx:ux*speed,  vy:uy*speed,
        r:Math.max(9,span*0.019),
        spin:(Math.random()-0.5)*3.2,
        rot:Math.random()*6.28,
        life:0, max:(lead+span*0.75)/speed, /* fly right across & off   */
        pts:pts, emit:0
      });

      /* escort shooting stars in the same direction */
      for(var i=0;i<4;i++){
        var pxv=-uy, pyv=ux;
        var off=(i-1.5)*(span*0.11)+(Math.random()-0.5)*span*0.05;
        METEOR.push({
          x:px+pxv*off-ux*span*0.55,
          y:py+pyv*off-uy*span*0.55,
          vx:ux*span*(0.8+Math.random()*0.45),
          vy:uy*span*(0.8+Math.random()*0.45),
          life:-(i*0.11+Math.random()*0.06),
          max:1.0+Math.random()*0.3,
          w:0.9+Math.random()*1.0,
          tail:0.07+Math.random()*0.04
        });
      }
      if(!raf) raf=requestAnimationFrame(draw);
    };
  }


  /* ---- Google-style particle burst inside the button ---- */
  (function(){
    var wrap=document.querySelector('.spark');
    if(!wrap||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    var cv=wrap.querySelector('canvas'),cx=cv.getContext('2d');
    var W=0,H=0,dpr=1,parts=[],raf=null;
    var COL=['#4285F4','#EA4335','#FBBC05','#34A853'];

    function fit(){
      dpr=Math.min(window.devicePixelRatio||1,2);
      W=wrap.clientWidth;H=wrap.clientHeight;
      cv.width=W*dpr;cv.height=H*dpr;
      cx.setTransform(dpr,0,0,dpr,0,0);
    }
    fit();
    var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(fit,150);});

    var MAX_PARTS=140;
    function burst(px,py){
      fit();
      if(parts.length>MAX_PARTS) parts.splice(0,parts.length-MAX_PARTS);
      var n=26;
      for(var i=0;i<n;i++){
        var ang=(Math.PI*2*i/n)+(Math.random()-0.5)*0.5;
        var spd=(0.9+Math.random()*2.3)*(W/300);
        parts.push({
          x:px,y:py,
          vx:Math.cos(ang)*spd,
          vy:Math.sin(ang)*spd*0.55,
          r:1+Math.random()*2.4,
          life:0,
          max:0.45+Math.random()*0.4,

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
  getRedirectResult, onAuthStateChanged, signOut, setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey:            "AIzaSyAwRNxLSVneeu_oQv-ptff1Fu6rVYso8t4",
  authDomain:        "andos-49b6a.firebaseapp.com",
  projectId:         "andos-49b6a",
  storageBucket:     "andos-49b6a.firebasestorage.app",
  messagingSenderId: "669879998185",
  appId:             "1:669879998185:web:ae076166918c0be6384278",
  measurementId:     "G-PEZ3JGQL91"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
auth.useDeviceLanguage();

const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: "select_account" });

const btn      = document.querySelector(".gbtn");
const toastEl  = document.getElementById("toast");
const welcome  = document.getElementById("welcome");
const wAvatar  = document.getElementById("wAvatar");
const wName    = document.getElementById("wName");
const wMail    = document.getElementById("wMail");
const outBtn   = document.getElementById("signOutBtn");
document.getElementById("toast").addEventListener("click", e => { e.currentTarget.classList.remove("show"); });

let toastTimer;
function toast(msg, kind = "") {
  clearTimeout(toastTimer);
  toastEl.textContent = msg;
  toastEl.style.whiteSpace = 'pre-line';
  toastEl.className = "toast show " + kind;
  toastTimer = setTimeout(() => { toastEl.className = "toast " + kind; }, 4200);
}
const busy = on => btn.classList.toggle("busy", on);

/* file:// will never work with Firebase auth — warn early */
if (location.protocol === "file:") {
  toast("Is page ko local server ya hosting se kholein — file:// par Google sign-in kaam nahi karega.", "err");
}

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

btn.addEventListener("click", async () => {
  if (btn.classList.contains("busy")) return;
  busy(true);
  try {
    await setPersistence(auth, browserLocalPersistence);
    if (isMobile) {
      await signInWithRedirect(auth, provider);   // page reloads
    } else {
      const res = await signInWithPopup(auth, provider);
      showUser(res.user);
    }
  } catch (e) {
    busy(false);
    handleError(e);
  }
});

/* returning from a redirect */
getRedirectResult(auth)
  .then(res => { if (res?.user) showUser(res.user); })
  .catch(handleError);

/* already signed in on this device */
onAuthStateChanged(auth, user => {
  busy(false);
  if (user) showUser(user, true);
});

function showUser(user, silent = false) {
  busy(false);
  const first = (user.displayName || "there").split(" ")[0];
  wName.textContent = "Welcome, " + first;
  wMail.textContent = user.email || "";
  if (user.photoURL) { wAvatar.src = user.photoURL; wAvatar.style.display = ""; }
  else wAvatar.style.display = "none";
  welcome.classList.add("show");
  if (!silent) toast("Signed in successfully", "ok");
  console.log("Signed in:", user.uid, user.displayName, user.email);
  // aage ki screen par bhejna ho to:  location.href = "/home.html";
}

outBtn.addEventListener("click", async () => {
  await signOut(auth);
  welcome.classList.remove("show");
  toast("Signed out");
});

function handleError(e) {
  if (!e || !e.code) return;
  busy(false);
  const map = {
    "auth/popup-closed-by-user":    null,                       // silent
    "auth/cancelled-popup-request": null,
    "auth/popup-blocked":           "Popup block ho gaya — dobara try karein.",
    "auth/unauthorized-domain":     "Is domain ko Firebase me add karein:\n" + location.hostname,
    "auth/operation-not-allowed":   "Google sign-in enable nahi hai. Console → Authentication → Sign-in method → Google → Enable.",
    "auth/network-request-failed":  "Network problem — internet check karein.",
    "auth/too-many-requests":       "Bahut zyada koshish — thodi der baad try karein."
  };
  if (e.code in map) { if (map[e.code]) toast(map[e.code], "err"); return; }
  console.error(e);
  toast("Sign-in fail: " + e.code, "err");
}
</script>
